name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for scratch files in repo root
        run: |
          scratch_files=$(find . -maxdepth 1 -type f \( -name '*.txt' -o -name '*.tmp' -o -name '*.bak' \) | sort)
          if [ -n "$scratch_files" ]; then
            echo "::error::Scratch files found in repo root:"
            echo "$scratch_files"
            exit 1
          fi
        
  docker:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t doc-converter:${{ github.sha }} .
        
      - name: Test Docker image
        run: docker run doc-converter:${{ github.sha }} --help
